<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكاديمية التسويق الرقمي</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  margin: 0;
  color: #26354a;
  text-align: center;
}
header {
  background: #173b63;
  color: white;
  padding: 45px 20px;
}
h1 { font-size: 32px; }
main {
  max-width: 750px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 14px;
}
h2 { color: #173b63; }
button {
  background: #e49b45;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}
input {
  display: block;
  width: 85%;
  padding: 12px;
  margin: 12px auto;
  border: 1px solid #ccc;
  border-radius: 6px;
}
</style>
</head>
<body>

<header>
<h1>أكاديمية التسويق الرقمي</h1>
<p>تعلم مهارات التسويق الرقمي في خمسة أيام</p>
</header>

<main>
<h2>هل تريد تطوير مهاراتك الرقمية؟</h2>
<p>انضم إلى دورتنا التدريبية المجانية واكتشف عالم التسويق الرقمي.</p>

<h2>ماذا ستتعلم؟</h2>
<p>التسويق عبر مواقع التواصل الاجتماعي</p>
<p>إنشاء صفحات الهبوط</p>
<p>قياس أداء الحملات الرقمية</p>

<h2>سجل الآن مجاناً</h2>

<form onsubmit="event.preventDefault(); alert('تم إرسال التسجيل التجريبي!');">
<input type="text" placeholder="الاسم الكامل" required>
<input type="email" placeholder="البريد الإلكتروني" required>
<button type="submit" id="register">سجّل الآن</button>
</form>

</main>
</body>
</html>
